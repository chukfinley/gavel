[project]
name = "gavel"
version = "0.1.0"
description = "A decision model: typed answers from runtime-defined options, with calibrated probabilities and no text generation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
test = ["pytest>=8.0"]

[project.scripts]
gavel-serve = "gavel.serve:main"
