[project]
name = "gavel"
version = "0.1.0"
description = "A decision model: typed answers from runtime-defined options, with calibrated probabilities and no text generation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
test = ["pytest>=8.0"]

[project.scripts]
gavel-serve = "gavel.serve:main"
gavel-webui = "gavel.webui:main"

[tool.pytest.ini_options]
# `_scratch` holds cloned foreign repositories (benchmark harnesses); their
# tests are not ours and do not import.
testpaths = ["tests"]
norecursedirs = ["_scratch", ".venv", "runs", "export", "data"]

[tool.ruff]
extend-exclude = ["_scratch"]

[tool.ruff.lint]
# What is deliberate here, so that `ruff check` only reports real findings:
# a dataset builder must survive a source that will not download (BLE001,
# S110, S112), the scripts are run with `python scripts/x.py` rather than
# executed directly (EXE001), and a script that exits right after writing a
# file does not need a context manager (SIM115).
ignore = ["BLE001", "EXE001", "SIM115", "S110", "S112"]
